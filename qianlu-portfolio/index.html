<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>纤璐不会玩摄影</title>
    <meta
      name="description"
      content="纤璐不会玩摄影 —— 摄影作品、计算机科普与开源工具。在搭配师的世界里，消解「暖暖玩家」与「不懂计算机」之间的刻板等号。"
    />

    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="纤璐不会玩摄影" />
    <meta
      property="og:description"
      content="摄影作品、计算机科普与开源工具。在搭配师的世界里，消解「暖暖玩家」与「不懂计算机」之间的刻板等号。"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // 防 FOUC：在首帧绘制前确定主题，避免暗色模式刷新时闪白。
      // 主题键沿用 qianlu.* 命名空间。
      (function () {
        try {
          var stored = localStorage.getItem('qianlu.theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : null;
          if (!mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage 不可用时静默降级为浅色，不阻塞渲染 */
        }
      })();

      // 防 FOUC：首帧前挂上配色性格类，白名单与 src/lib/settings.ts 保持一致。
      (function () {
        var valid = { air: 1, vivid: 1, spectrum: 1, deep: 1 };
        var palette = null;
        try {
          palette = localStorage.getItem('qianlu.settings.palette');
        } catch (e) {
          /* localStorage 不可用时回退默认 air */
        }
        var next = Object.prototype.hasOwnProperty.call(valid, palette) ? palette : 'air';
        document.documentElement.classList.add('palette-' + next);
      })();

      // 防 FOUC：首帧前确定语言与书写方向，避免阿拉伯语刷新时 RTL 布局闪烁。
      // 白名单与检测顺序与 src/lib/i18n.ts 保持一致。
      (function () {
        var valid = { zh: 1, en: 1, fr: 1, ru: 1, es: 1, ar: 1 };
        var lang = null;
        try {
          lang = localStorage.getItem('qianlu.lang');
        } catch (e) {
          /* localStorage 不可用时走浏览器语言检测 */
        }
        if (!lang || !Object.prototype.hasOwnProperty.call(valid, lang)) {
          lang = null;
          var preferred = navigator.languages || [navigator.language || 'zh'];
          for (var i = 0; i < preferred.length; i++) {
            var prefix = String(preferred[i]).slice(0, 2).toLowerCase();
            if (Object.prototype.hasOwnProperty.call(valid, prefix)) {
              lang = prefix;
              break;
            }
          }
          if (!lang) lang = 'zh';
        }
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
